model: Qwen/Qwen3-0.6B
train: true
data: backend/finetuning/data
fine_tune_type: lora
batch_size: 1
grad_accumulation_steps: 4
iters: 250
learning_rate: 0.00001
num_layers: 12
max_seq_length: 1024
mask_prompt: true
steps_per_report: 10
steps_per_eval: 50
save_every: 50
adapter_path: backend/finetuning/adapters
seed: 44
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
  rank: 8
  scale: 16.0
  dropout: 0.05
