AWSTemplateFormatVersion: "2010-09-09"
Description: HealthAI Agent Lab monthly cost guard (deploy in us-east-1)

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues: [staging, production]
  BudgetEmail:
    Type: String
    Description: Address that receives AWS budget notifications
  MonthlyBudgetUsd:
    Type: Number
    Default: 20

Resources:
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub healthai-${Environment}-monthly
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 60
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 90
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  BudgetName:
    Value: !Ref MonthlyBudget
