name: Keep Render service warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check the health endpoint
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          if [ -z "$RENDER_APP_URL" ]; then
            echo "Add RENDER_APP_URL as a repository Actions secret."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 45 \
            --retry 2 --retry-delay 5 \
            "${RENDER_APP_URL%/}/health"
